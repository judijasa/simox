# Dev machine DEFAULT config (committed). The framework's init-local-env.sh
# sources this committed default, then the optional git-ignored override
# etc/dev.conf (sourced last, it wins) — bin/fetch-private-data materializes the
# override from the private repo, but a checkout without one still works on
# these defaults. It holds only non-derived, consumer-chosen dev values;
# derived values (REPO_PATH/REPO_LOG) stay derived by init-local-env.sh and
# never appear here.

# DBUSER: the SQL user `ema mdb <db>` connects as — simox's single
# service account (see doc/system/service-accounts.md).
export DBUSER=${DBUSER:-$(whoami)}

# SSL_DIR: directory holding this machine's TLS client certificate
# (client.crt + client.key) for the `require: 'X509'` service account. The
# framework's machine-cert CLI (vendor/bin/gen-cert) mints and installs into it;
# the prod app layer derives its client.crt/client.key paths from the same
# SSL_DIR name (via DEPLOY_SSL_DIR in etc/deploy.conf). An unquoted ~/$HOME is
# expanded by the sourcing shell; a quoted ~ is not, and now fails loudly. See
# doc/system/machine-certs.md for the mint/sign/install steps.
export SSL_DIR=~/.ssl

# CLICKHOUSE_USER: SQL user for the cron-job metrics hooks
# (src/utils/clickhouse.php). ClickHouse auth is passwordless here — the
# machine client certificate from SSL_DIR is the boundary — so there is no
# password key; unset falls back to the client's own `default`. The endpoint
# lives in etc/clickhouse.ini (private, from etc/clickhouse.ini.template).
export CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
