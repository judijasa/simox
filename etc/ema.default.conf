; Host-level DEFAULT config consumed by the 'ema' CLI (the DB layer).
;
; One [default] section per host. Unlike reuter.ini (one [<dbname>] section per
; database), this file is host-wide: every instance ema provisions on this host
; reads it, and the value is written into that instance's [mysqld] when the
; instance is provisioned. This committed, tracked default is read as a
; fallback; the optional git-ignored override etc/ema.conf is merged over it
; (an override that defines the key wins — even empty, which clears a default).
;
; ssl-ca is the CA the instance's server verifies CLIENT certificates against —
; the server half of simox's `require: 'X509'` service account. Its value is an
; absolute path on this host; the operator installs the CA there out of band,
; and ema records the path only, never the certificate bytes. The committed path
; is simox's convention for the server CA; a host that diverges from it sets an
; etc/ema.conf override (or clears it with an empty value to go plain TCP).
; EMA_SSL_CA overrides the key. See doc/system/machine-certs.md.

[default]
ssl-ca = /etc/simox/ssl/ca.crt
