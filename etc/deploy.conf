# Project-static deploy configuration (committed to the repo).
# `deploy` requires it at the repo root and fails loudly if missing.
#
# .env (generated, git-ignored) holds machine settings; this file holds the
# deployment target shared by every machine of the project.
#
# `gen-env` (run on the remote by the deploy wrapper on every deploy)
# projects the git-ignored .env from THIS file — there is no separate
# etc/env.prod anymore. The projection:
#   REPO_PATH      := DEPLOY_TARGET_DIR
#   REPO_LOG       := DEPLOY_LOG_DIR
#   REUTER_INI     := /etc/<DEPLOY_DB_INSTANCE>/reuter.ini
#   EMA_TARGET     := prod (constant)
#
# .env stays MYSQL_*-free: the socket lives in
# the prod reuter.ini section — gen-reuter writes
# MYSQL_UNIX_PORT=$DEPLOY_DB_BASE/mysql.sock into each [<dbname>] section for
# the `ema` CLI (root/unix_socket auth). The app layer stays TCP-only.
#
# PROD_USER: unprivileged app user on the remote host. Must exist with SSH
# access before the first deploy (see README "Before the first deploy").
export PROD_USER=simox

# DEPLOY_TARGET_DIR: remote repo location.
export DEPLOY_TARGET_DIR=/srv/apps/simox

# DEPLOY_LOG_DIR: remote log dir (deploy_version.log lives here).
export DEPLOY_LOG_DIR=/var/log/simox

# DEPLOY_DB_BASE: remote root of the per-project MariaDB instance. The
# instance identity is derived from it by convention (same shape as the dev
# sandbox's var/mariadb):
#   datadir  = $DEPLOY_DB_BASE/data
#   socket   = $DEPLOY_DB_BASE/mysql.sock
#   pid-file = $DEPLOY_DB_BASE/mysql.pid
# gen-reuter writes MYSQL_UNIX_PORT=$DEPLOY_DB_BASE/mysql.sock into each prod
# reuter.ini section (for `ema init db <name>` root socket access on the DB host).
# Created and initialized by `deploy --init` (the framework's generic
# bin/pf-provision.sh); the daemon runs as PROD_USER via a systemd template
# unit (mariadb@simox), started exactly once and durable across reboots.
export DEPLOY_DB_BASE=/var/lib/simox/mariadb

# DEPLOY_DB_INSTANCE: systemd unit instance name + config dir (/etc/simox/
# my.cnf, next to the prod reuter.ini).
export DEPLOY_DB_INSTANCE=simox

# DEPLOY_DB_PORT: REQUIRED on the database host — the TCP port the MariaDB
# instance listens on. Every prod script connects to the database over TCP
# (gen-reuter writes SERVER/PORT into the prod reuter.ini sections), on the
# DB host and on app-only hosts alike. Bind it to the ZeroTier IP via
# DEPLOY_DB_BIND.
export DEPLOY_DB_PORT=3307

# DEPLOY_DB_BIND: address the daemon binds to. Defaults to 0.0.0.0 (all
# interfaces); set it to the DB host's ZeroTier IP to restrict access to
# the overlay network.
# export DEPLOY_DB_BIND=<zerotier-ip>

# DEPLOY_NIX_RESULT_DIR: remote nix result parent.
export DEPLOY_NIX_RESULT_DIR=/usr/local/simox

# DEPLOY_NIX_GCROOT: remote nix gcroot.
export DEPLOY_NIX_GCROOT=/nix/var/nix/gcroots/simox

# DEPLOY_INIT_CMD: consumer-specific provisioning extras run over SSH by `deploy
# --init` AFTER the framework's bin/pf-provision.sh and BEFORE other pf-deploy
# steps. To reproduce that mid-sequence with a wrapper composition --instead
# of the current hook, would require the extra effort of rederiving
# the framework's internal state. Skipped if unset.
export DEPLOY_INIT_CMD="bash bin/deploy/provision-extra.sh"

# CRON_FILE: remote crontab file the framework `cron-manifest` output is
# installed to by the deploy wrapper on every deploy.
export CRON_FILE=/etc/cron.d/simo-orchestrator

# CRON_USER: user the cron entries run as.
export CRON_USER=root
