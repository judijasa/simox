# Project-static deploy configuration (committed to the repo).
# `deploy` requires it at the repo root and fails loudly if missing.
#
# .env (generated, git-ignored) holds machine settings; this file holds the
# deployment target shared by every machine of the project.
#
# `gen-env` (run on the remote by the framework pf-deploy on every deploy)
# projects the git-ignored .env from THIS file — there is no separate
# etc/env.prod anymore. The projection:
#   REPO_PATH      := DEPLOY_TARGET_DIR
#   REPO_LOG       := DEPLOY_LOG_DIR
#   REUTER_INI     := DEPLOY_REUTER_INI
#   EMA_TARGET     := prod (constant)
#
# .env stays MYSQL_*-free: the socket lives in
# the prod reuter.ini section (MYSQL_UNIX_PORT, recorded from `ema create`
# output). The app layer stays TCP-only.
#
# PROD_USER: unprivileged app user on the remote host. Must exist with SSH
# access before the first deploy (see README "Before the first deploy").
export PROD_USER=simox

# DEPLOY_TARGET_DIR: remote repo location.
export DEPLOY_TARGET_DIR=/srv/apps/simox

# DEPLOY_LOG_DIR: remote log dir (deploy_version.log lives here).
export DEPLOY_LOG_DIR=/var/log/simox

# DEPLOY_REUTER_INI: path to the consumer's manual reuter.ini — one
# [<dbname>] section per database (`simo0` primary and `simo1` read-only
# replica; SERVER/PORT/DBMS/MYSQL_UNIX_PORT plus the SIMOX_PASSWORD /
# PUBLIC_PASSWORD keys), recorded from `ema create`'s output. Service
# accounts are reconciled by bin/gen-service-users against
# etc/service-users.sql, not provisioned here. gen-env writes it into .env
# as REUTER_INI; pf-deploy's db-check reads it to verify reachability. The
# file itself is private data, injected into etc/ by fetch-private-data (see
# doc/system/private-config.md).
export DEPLOY_REUTER_INI=/srv/apps/simox/etc/reuter.ini

# DEPLOY_NIX_RESULT_DIR: remote nix result parent.
export DEPLOY_NIX_RESULT_DIR=/usr/local/simox

# DEPLOY_NIX_GCROOT: remote nix gcroot.
export DEPLOY_NIX_GCROOT=/nix/var/nix/gcroots/simox

# DEPLOY_INIT_CMD: consumer-specific provisioning extras run over SSH by `deploy`
# AFTER the framework's bin/pf-provision.sh and BEFORE other pf-deploy
# steps. To reproduce that mid-sequence with a wrapper composition --instead
# of the current hook, would require the extra effort of rederiving
# the framework's internal state. Skipped if unset.
export DEPLOY_INIT_CMD="bash bin/deploy/provision-extra.sh"

# CRON_FILE: remote crontab file the framework `cron-manifest` output is
# installed to by pf-deploy's built-in worker step on every deploy. REQUIRED
# on hosts tagged `worker` (pf-deploy fails loudly if unset there); unused on
# non-worker hosts.
export CRON_FILE=/etc/cron.d/simo-orchestrator

# CRON_USER: user the cron entries run as.
export CRON_USER=root
